# Configures the server Terraform created (found by tag). From WSL, in this folder: ansible-playbook site.yml
- name: Set up the Linux server (Docker, Kubernetes/k3s, Jenkins)
  hosts: aws_ec2
  become: true
  gather_facts: false
  handlers:
    - name: Restart Jenkins
      ansible.builtin.service:
        name: jenkins
        state: restarted
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for first-boot cloud-init to release apt
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install Docker, JDK, Maven, Git, Ansible and the Kubernetes Python client
      ansible.builtin.apt:
        name: [docker.io, openjdk-21-jdk-headless, maven, git, ansible, python3-kubernetes, fontconfig]
        update_cache: true

    - name: Add Jenkins LTS apt repo (with its signing key)
      ansible.builtin.deb822_repository:
        name: jenkins
        uris: https://pkg.jenkins.io/debian-stable
        suites: binary/
        signed_by: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        update_cache: true

    - name: Add Trivy apt repo (with its signing key)
      ansible.builtin.deb822_repository:
        name: trivy
        uris: https://get.trivy.dev/deb
        suites: generic
        components: main
        signed_by: https://get.trivy.dev/deb/public.key

    - name: Install Trivy (security scanner, run by Jenkins)
      ansible.builtin.apt:
        name: trivy
        update_cache: true

    - name: Let Jenkins build Docker images
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true
      notify: Restart Jenkins

    - name: Let Jenkins load images into k3s (that one root command only)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/jenkins-k3s
        content: "jenkins ALL=(root) NOPASSWD: /usr/local/bin/k3s ctr images import -\n"
        mode: "0440"
        validate: visudo -cf %s

    # Traefik is off because it would take port 443, which this server uses for SSH
    - name: Install k3s (single-node Kubernetes; kubeconfig readable so Jenkins can deploy)
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Apply the Jenkins restart now
      ansible.builtin.meta: flush_handlers

    # Jenkins deletes this password once its setup wizard is finished, so only look for it before then
    - name: Check whether Jenkins setup is finished
      ansible.builtin.stat:
        path: /var/lib/jenkins/jenkins.install.UpgradeWizard.state
      register: jenkins_setup

    - name: Wait for Jenkins first-run password
      ansible.builtin.wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
      when: not jenkins_setup.stat.exists

    - name: Read it
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_pw
      when: not jenkins_setup.stat.exists

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "Jenkins: http://{{ inventory_hostname }}:8080{{ '' if jenkins_setup.stat.exists else '  (initial admin password: ' ~ (jenkins_pw.content | b64decode | trim) ~ ')' }}"
          - "App:     http://{{ inventory_hostname }}/"
