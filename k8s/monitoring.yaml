# Prometheus + Grafana + Alertmanager, applied by ansible/deploy.yml.
# Their NodePorts are not open in the AWS security group, so they are only reachable through an SSH tunnel (see README).
# shortcut: metrics are stored in emptyDir and vanish if the pod restarts; add a PersistentVolume if history matters.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    scrape_configs:
      - job_name: nlp-api
        metrics_path: /actuator/prometheus
        # The headless Service returns every pod's IP, so each replica is scraped separately
        dns_sd_configs:
          - names: [nlp-api-metrics.default.svc.cluster.local]
            type: A
            port: 8081
  alerts.yml: |
    groups:
      - name: nlp-api
        rules:
          - alert: NlpApiPodsMissing
            # "or vector(0)" keeps the alert working when no pods are left to report
            expr: (sum(up{job="nlp-api"}) or vector(0)) < 2
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "NLP API has fewer than 2 healthy pods"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
      annotations:
        config-version: "2" # raise this after editing prometheus-config, so Prometheus restarts and reloads it
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  # shortcut: alerts only show in the Alertmanager page; add an email or Slack receiver to send them anywhere
  alertmanager.yml: |
    route:
      receiver: dashboard-only
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: dashboard-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
          ports:
            - containerPort: 9093
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - port: 9093
      nodePort: 30093
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: nlp-api
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  nlp-api.json: |
    {
      "uid": "nlp-api",
      "title": "NLP API",
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "title": "Pods up",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 8 },
          "targets": [{ "expr": "sum(up{job=\"nlp-api\"})" }]
        },
        {
          "title": "Requests per second",
          "type": "timeseries",
          "gridPos": { "x": 6, "y": 0, "w": 9, "h": 8 },
          "targets": [{ "expr": "sum by (uri) (rate(http_server_requests_seconds_count{job=\"nlp-api\"}[1m]))", "legendFormat": "{{uri}}" }]
        },
        {
          "title": "Average response time (seconds)",
          "type": "timeseries",
          "gridPos": { "x": 15, "y": 0, "w": 9, "h": 8 },
          "targets": [{ "expr": "sum by (uri) (rate(http_server_requests_seconds_sum{job=\"nlp-api\"}[1m])) / sum by (uri) (rate(http_server_requests_seconds_count{job=\"nlp-api\"}[1m]))", "legendFormat": "{{uri}}" }]
        },
        {
          "title": "CPU usage per pod",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [{ "expr": "process_cpu_usage{job=\"nlp-api\"}", "legendFormat": "{{instance}}" }]
        },
        {
          "title": "JVM memory used per pod",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{ "expr": "sum by (instance) (jvm_memory_used_bytes{job=\"nlp-api\"})", "legendFormat": "{{instance}}" }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
          env:
            # Read-only access without a login is safe here because Grafana is only reachable through the SSH tunnel
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/nlp-api.json }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - port: 3000
      nodePort: 30300
